{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<form method="post" class="form">
  <h2>Seller log in</h2>
  <label class="f" for="email">Email</label><input id="email" type="email" name="email" required>
  <label class="f" for="password">Password</label><input id="password" type="password" name="password" required>
  <button class="btn block">Log in</button>
  <p class="muted center"><a href="{{ url_for('adminforgot') }}">Forgot password?</a> | <a href="{{ url_for('admincreate') }}">Become a seller</a></p>
</form>
{% endblock %}
