<form method="post" enctype="multipart/form-data" class="form wide">
  <label class="f" for="title">Product name</label><input id="title" name="title" maxlength="255" value="{{ item.item_name if item }}" required>
  <label class="f" for="description">Description</label><textarea id="description" name="description" rows="5" required>{{ item.description if item }}</textarea>
  <div class="row">
    <div style="flex:1;min-width:140px"><label class="f" for="price">Price (&#8377;)</label><input id="price" type="number" step="0.01" min="0" name="price" value="{{ item.price if item }}" required></div>
    <div style="flex:1;min-width:140px"><label class="f" for="quantity">Quantity in stock</label><input id="quantity" type="number" min="0" name="quantity" value="{{ item.quantity if item }}" required></div>
  </div>
  <label class="f" for="category">Category</label>
  <select id="category" name="category">{% for c in categories %}<option value="{{ c }}" {{ 'selected' if item and item.category == c }}>{{ c|replace('_',' ') }}</option>{% endfor %}</select>
  <label class="f" for="file">Product image{% if item %} (leave empty to keep the current one){% endif %}</label>
  <input id="file" type="file" name="file" accept="image/*" {{ '' if item else 'required' }}>
  <button class="btn block">{{ 'Save changes' if item else 'Add product' }}</button>
</form>
