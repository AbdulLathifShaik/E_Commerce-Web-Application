{% extends "base.html" %}
{% block title %}{{ item.item_name }}{% endblock %}
{% block content %}
<div class="detail">
  <img src="{{ url_for('static', filename='uploads/' ~ item.image_name) }}" alt="{{ item.item_name }}">
  <div>
    <span class="badge" data-cat="{{ item.category }}">{{ item.category|replace('_',' ') }}</span>
    <h1>{{ item.item_name }}</h1>
    <div class="price big">&#8377;{{ '%.2f'|format(item.price) }}</div>
    <p class="muted">{{ item.quantity }} in stock</p>
    <p class="desc">{{ item.description }}</p>
    <div class="row">
      <a class="btn" href="{{ url_for('updateitem', item_id=item.id) }}">Edit</a>
      <a class="btn ghost" href="{{ url_for('viewallitems') }}">Back to my products</a>
    </div>
  </div>
</div>
{% endblock %}
