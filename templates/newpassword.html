{% extends "base.html" %}
{% block title %}New password{% endblock %}
{% block content %}
<form method="post" class="form">
  <h2>Set a new password</h2>
  <label class="f" for="npassword">New password</label><input id="npassword" type="password" name="npassword" minlength="6" required>
  <label class="f" for="cpassword">Confirm password</label><input id="cpassword" type="password" name="cpassword" minlength="6" required>
  <button class="btn block">Save password</button>
</form>
{% endblock %}
